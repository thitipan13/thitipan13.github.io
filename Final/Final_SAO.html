    controls.update();

    // ============================================================
    // 2. Lighting & Atmosphere (Fantasy Aincrad Daylight)
    // ============================================================
    // Sky Ambient Light
    const ambientLight = new THREE.HemisphereLight(0xd9ebff, 0x5a6d82, 0.7);
    scene.add(ambientLight);

    // Main Fantasy Sunlight
    const sunLight = new THREE.DirectionalLight(0xfffaed, 1.8);
    sunLight.position.set(6.0, 8.5, 4.5);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.bias = -0.0001;
    sunLight.shadow.normalBias = 0.025;
    sunLight.shadow.camera.near = 0.5;
    sunLight.shadow.camera.far = 24;
    sunLight.shadow.camera.left = -5.5;
    sunLight.shadow.camera.right = 5.5;
    sunLight.shadow.camera.top = 5.5;
    sunLight.shadow.camera.bottom = -5.5;
    scene.add(sunLight);

    // Teleport Portal Magic Glow (Center Cyan Light)
    const portalLight = new THREE.PointLight(0x38bdf8, 2.0, 5.0, 2.0);
    portalLight.position.set(0, 0.6, 0);
    scene.add(portalLight);

    // Subtle Rim Light for Gold Sphere & Cel Object
    const rimLeft = new THREE.PointLight(0xffdf80, 1.2, 4.5, 2.0);
    rimLeft.position.set(-2.2, 2.0, 1.0);
    scene.add(rimLeft);

    const rimRight = new THREE.PointLight(0x38bdf8, 1.2, 4.5, 2.0);
    rimRight.position.set(2.2, 2.0, 1.0);
    scene.add(rimRight);

    // ============================================================
    // 3. Procedural Stone Texture for Aincrad Architecture
    // ============================================================
    function createAincradStoneTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      // Base stone tone
      ctx.fillStyle = '#b8c4d1';
      ctx.fillRect(0, 0, 512, 512);

      // Subtle stone noise
      for (let i = 0; i < 25000; i++) {
        const x = Math.random() * 512;
        const y = Math.random() * 512;
        const shade = Math.floor(Math.random() * 30) - 15;
        ctx.fillStyle = `rgba(${180 + shade}, ${190 + shade}, ${205 + shade}, 0.15)`;
        ctx.fillRect(x, y, 2, 2);
      }

      // Circular paving rings
      ctx.strokeStyle = 'rgba(90, 110, 130, 0.35)';
      ctx.lineWidth = 3;
      for (let r = 40; r < 250; r += 45) {
        ctx.beginPath();
        ctx.arc(256, 256, r, 0, Math.PI * 2);
        ctx.stroke();
      }

      // Radial stone cuts
      for (let a = 0; a < Math.PI * 2; a += Math.PI / 8) {
        ctx.beginPath();
        ctx.moveTo(256 + Math.cos(a) * 40, 256 + Math.sin(a) * 40);
        ctx.lineTo(256 + Math.cos(a) * 245, 256 + Math.sin(a) * 245);
        ctx.stroke();
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(2, 2);
      tex.encoding = THREE.sRGBEncoding;
      return tex;
    }

    const aincradStoneTex = createAincradStoneTexture();

    // ============================================================
    // 4. Constructing 3D Geometry from Blender Data
    // ============================================================
    function buildBufferGeometry(data) {
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(data.vertices, 3));
      geo.setAttribute('normal', new THREE.BufferAttribute(data.normals, 3));
      geo.setAttribute('uv', new THREE.BufferAttribute(data.uvs, 2));
      geo.setIndex(new THREE.BufferAttribute(data.indices, 1));
      return geo;
    }

    const saoData = window.SAO_SCENE_DATA;
    if (!saoData) {
      console.error('Error: SAO_SCENE_DATA not loaded!');
    }

    // 4.1 Teleport Plaza Dais
    const plazaGeo = buildBufferGeometry(saoData.plaza);
    const plazaMat = new THREE.MeshStandardMaterial({
      color: 0xd2dbe5,
      map: aincradStoneTex,
      roughness: 0.65,
      metalness: 0.15
    });
    const plazaMesh = new THREE.Mesh(plazaGeo, plazaMat);
    plazaMesh.receiveShadow = true;
    scene.add(plazaMesh);

    // 4.2 Ancient Obelisks / Pillars
    const pillarsGeo = buildBufferGeometry(saoData.pillars);
    const pillarsMat = new THREE.MeshStandardMaterial({
      color: 0xbac8d6,
      roughness: 0.55,
      metalness: 0.2
    });
    const pillarsMesh = new THREE.Mesh(pillarsGeo, pillarsMat);
    pillarsMesh.castShadow = true;
    pillarsMesh.receiveShadow = true;
    scene.add(pillarsMesh);

    // 4.3 Stone Altars
    const altarsGeo = buildBufferGeometry(saoData.altars);
    const altarsMat = new THREE.MeshStandardMaterial({
      color: 0x93a4b6,
      roughness: 0.45,
      metalness: 0.3
    });
    const altarsMesh = new THREE.Mesh(altarsGeo, altarsMat);
    altarsMesh.castShadow = true;
    altarsMesh.receiveShadow = true;
    scene.add(altarsMesh);

    // ============================================================
    // 5. The Two Main Showcase Objects (Kept as Requested)
    // ============================================================
    // 5.1 Gold Sphere (PBR Material Showcase) on Left Altar
    const goldSphereGeo = new THREE.SphereGeometry(0.42, 64, 64);
    const goldSphereMat = new THREE.MeshStandardMaterial({
      color: 0xffd700, // Rich Pure Gold
      roughness: 0.12,
      metalness: 0.96
    });
    const goldSphere = new THREE.Mesh(goldSphereGeo, goldSphereMat);
    goldSphere.position.set(-2.2, 1.42, 0);
    goldSphere.castShadow = true;
    goldSphere.receiveShadow = true;
    scene.add(goldSphere);

    // 5.2 Cel-Shaded Torus Knot with Outline (From User's Image) on Right Altar
    const celUniforms = {
      uLightDir: { value: sunLight.position.clone().normalize() }
    };

    const celVertexShader = `
      varying vec3 vNormal;
      varying vec3 vPosW;
      void main() {
        vNormal = normalMatrix * normal;
        vec4 worldPos = modelMatrix * vec4(position, 1.0);
        vPosW = worldPos.xyz;
        gl_Position = projectionMatrix * viewMatrix * worldPos;
      }
    `;

    // Dark teal/cyan cel shading exactly matching the user's uploaded image
    const celFragmentShader = `
      precision mediump float;
      uniform vec3 uLightDir;
      varying vec3 vNormal;
      varying vec3 vPosW;
      void main() {
        vec3 N = normalize(vNormal);
        vec3 L = normalize(uLightDir);
        float diff = max(dot(N, L), 0.0);

        // Discrete cel shading steps (matching SAO/anime style)
        float level = 3.0;
        diff = floor(diff * level) / level;

        // Dark teal/cyan palette matching the screenshot
        vec3 shadowColor = vec3(0.015, 0.12, 0.16);
        vec3 midColor    = vec3(0.04, 0.28, 0.36);
        vec3 litColor    = vec3(0.08, 0.48, 0.58);

        vec3 color = mix(shadowColor, midColor, step(0.33, diff));
        color = mix(color, litColor, step(0.66, diff));

        gl_FragColor = vec4(color, 1.0);
      }
    `;

    const celMat = new THREE.ShaderMaterial({
      vertexShader: celVertexShader,
      fragmentShader: celFragmentShader,
      uniforms: celUniforms
    });

    const torusGeo = new THREE.TorusKnotGeometry(0.34, 0.13, 96, 16);
    const celTorus = new THREE.Mesh(torusGeo, celMat);
    celTorus.position.set(2.2, 1.45, 0);
    celTorus.castShadow = true;
    scene.add(celTorus);

    // Outline Shader (Inverted Hull technique from Week 12)
    const outlineMat = new THREE.ShaderMaterial({
      vertexShader: `
        void main() {
          vec3 pos = position + normal * 0.042;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
        }
      `,
      fragmentShader: `
        void main() {
          gl_FragColor = vec4(0.01, 0.04, 0.07, 1.0);
        }
      `,
      side: THREE.BackSide
    });
    const celOutline = new THREE.Mesh(torusGeo, outlineMat);
    celOutline.position.copy(celTorus.position);
    scene.add(celOutline);

    // ============================================================
    // 6. Animation Loop & Resize
    // ============================================================
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      // Gentle floating/rotating of the showcase objects
      goldSphere.rotation.y = t * 0.4;
      goldSphere.position.y = 1.42 + Math.sin(t * 1.5) * 0.04;

      celTorus.rotation.y = t * 0.45;
      celTorus.rotation.x = t * 0.25;
      celTorus.position.y = 1.45 + Math.sin(t * 1.5 + 1.0) * 0.04;
      celOutline.rotation.copy(celTorus.rotation);
      celOutline.position.copy(celTorus.position);

      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
