<body>
<button id="btn-reset-cam" title="รีเซ็ตมุมมอง">🔄</button>
<div id="canvas-container"></div>
<script>
const container=document.getElementById('canvas-container');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x7ba3d0);
scene.fog=new THREE.FogExp2(0x8bb2db,0.024);

const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,0.1,100);
const initialCamPos=new THREE.Vector3(0,3.8,8.2);
const initialCamTarget=new THREE.Vector3(0,1.2,0);
camera.position.copy(initialCamPos);

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
container.appendChild(renderer.domElement);

const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.dampingFactor=0.08;
controls.target.copy(initialCamTarget);
controls.maxPolarAngle=Math.PI/2+0.02;
controls.minDistance=1;
controls.maxDistance=18;

scene.add(new THREE.HemisphereLight(0xdbeafe,0x64748b,0.75));

const sunLight=new THREE.DirectionalLight(0xfff7ed,1.25);
sunLight.position.set(5.5,9,4.5);
sunLight.castShadow=true;
sunLight.shadow.mapSize.width=sunLight.shadow.mapSize.height=2048;
sunLight.shadow.camera.near=0.5;sunLight.shadow.camera.far=25;
sunLight.shadow.camera.left=-6;sunLight.shadow.camera.right=6;
sunLight.shadow.camera.top=6;sunLight.shadow.camera.bottom=-6;
sunLight.shadow.bias=-0.0004;
scene.add(sunLight);

const fillLight=new THREE.DirectionalLight(0x93c5fd,0.45);
fillLight.position.set(-5,4,-4);
scene.add(fillLight);

const crystalLight=new THREE.PointLight(0x38bdf8,1.1,3.2);
crystalLight.position.set(-1.425,1.05,2.468);
scene.add(crystalLight);

const potionLight=new THREE.PointLight(0xf43f5e,0.95,2.8);
potionLight.position.set(1.425,0.9,2.468);
scene.add(potionLight);

const texLoader=new THREE.TextureLoader();
function getTexture(k,f){
  const src=(window.SAO_ASSETS&&window.SAO_ASSETS[k])?window.SAO_ASSETS[k]:f;
  const t=texLoader.load(src);t.encoding=THREE.sRGBEncoding;return t;
}

function makeBufGeo(d){
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(d.vertices,3));
  if(d.normals&&d.normals.length>0)g.setAttribute('normal',new THREE.BufferAttribute(d.normals,3));
  else g.computeVertexNormals();
  if(d.uvs&&d.uvs.length>0)g.setAttribute('uv',new THREE.BufferAttribute(d.uvs,2));
  if(d.indices&&d.indices.length>0)g.setIndex(new THREE.BufferAttribute(d.indices,1));
  return g;
}

const D=window.SAO_SCENE_DATA||{};

function addStatic(key,mat,cast,recv){
  if(!D[key])return null;
  const m=new THREE.Mesh(makeBufGeo(D[key]),mat);
  if(cast)m.castShadow=true;
  if(recv)m.receiveShadow=true;
  scene.add(m);return m;
}

addStatic('plaza',new THREE.MeshStandardMaterial({color:0x94a3b8,roughness:0.62,metalness:0.12}),false,true);
addStatic('pillars',new THREE.MeshStandardMaterial({color:0xcbd5e1,roughness:0.48,metalness:0.15}),true,true);
addStatic('altars',new THREE.MeshStandardMaterial({color:0x64748b,roughness:0.38,metalness:0.28}),true,true);
addStatic('monuments',new THREE.MeshStandardMaterial({color:0x334155,roughness:0.52,metalness:0.2}),true,true);
addStatic('text3d',new THREE.MeshStandardMaterial({color:0xfbbf24,metalness:0.85,roughness:0.2,emissive:0xd97706,emissiveIntensity:0.35}),true,false);

let poleMesh=null;
if(D.bannerPole){

let bonesMesh=null;

  bonesMesh.castShadow=true;scene.add(bonesMesh);
}

const interactableObjects=[];
function reg(mesh,id){mesh.userData={id,isInteractable:true};interactableObjects.push(mesh);}

const meTex=getTexture('me','sao_profile_screen.png');
const meMesh=new THREE.Mesh(new THREE.PlaneGeometry(1.536,1.92),new THREE.MeshStandardMaterial({map:meTex,roughness:0.25,metalness:0.15,emissive:0x0284c7,emissiveMap:meTex,emissiveIntensity:0.12}));
meMesh.position.set(0,1.57,-2.645);meMesh.receiveShadow=true;scene.add(meMesh);
reg(meMesh,'center_monument');

const R32=32*Math.PI/180;
const paintTex=getTexture('paint','paint.png');
const paintMesh=new THREE.Mesh(new THREE.PlaneGeometry(1.22,0.63),new THREE.MeshStandardMaterial({map:paintTex,roughness:0.35,metalness:0.1}));
paintMesh.position.set(-2.446,2,-1.563);paintMesh.rotation.y=R32;paintMesh.castShadow=true;scene.add(paintMesh);
const paintFrame=new THREE.Mesh(new THREE.PlaneGeometry(1.28,0.69),new THREE.MeshStandardMaterial({color:0x0284c7,roughness:0.28,metalness:0.8}));
paintFrame.position.set(-2.448,2,-1.566);paintFrame.rotation.y=R32;scene.add(paintFrame);
reg(paintMesh,'left_monument');reg(paintFrame,'left_monument');

const icgTex=getTexture('interactive_cg','interactive_cg.png');
const icgMesh=new THREE.Mesh(new THREE.PlaneGeometry(0.78,0.86),new THREE.MeshStandardMaterial({map:icgTex,roughness:0.35,metalness:0.1}));
icgMesh.position.set(-2.446,1.18,-1.563);icgMesh.rotation.y=R32;icgMesh.castShadow=true;scene.add(icgMesh);
const icgFrame=new THREE.Mesh(new THREE.PlaneGeometry(0.84,0.92),new THREE.MeshStandardMaterial({color:0x0ea5e9,roughness:0.28,metalness:0.8}));
icgFrame.position.set(-2.448,1.18,-1.566);icgFrame.rotation.y=R32;scene.add(icgFrame);
reg(icgMesh,'left_monument');reg(icgFrame,'left_monument');

if(charMesh)reg(charMesh,'character');
if(bonesMesh)reg(bonesMesh,'character');
const charHitbox=new THREE.Mesh(new THREE.CylinderGeometry(0.88,0.88,2,16),new THREE.MeshBasicMaterial({visible:false}));
charHitbox.position.set(2.45,1.25,-1.65);scene.add(charHitbox);reg(charHitbox,'character');

const crystalMat=new THREE.MeshStandardMaterial({color:0x38bdf8,roughness:0.08,metalness:0.92,emissive:0x0284c7,emissiveIntensity:0.35,flatShading:true});
const crystalTop=new THREE.Mesh(new THREE.ConeGeometry(0.18,0.32,6),crystalMat);crystalTop.position.y=0.16;crystalTop.castShadow=true;
const crystalBot=new THREE.Mesh(new THREE.ConeGeometry(0.18,0.32,6),crystalMat);crystalBot.geometry.rotateX(Math.PI);crystalBot.position.y=-0.16;crystalBot.castShadow=true;
const teleportCrystal=new THREE.Group();teleportCrystal.add(crystalTop,crystalBot);
teleportCrystal.position.set(-1.425,1.02,2.468);scene.add(teleportCrystal);
reg(crystalTop,'crystal');reg(crystalBot,'crystal');

const celMat=new THREE.ShaderMaterial({
  uniforms:{uLightDir:{value:sunLight.position.clone().normalize()}},
  vertexShader:`varying vec3 vNormal;void main(){vNormal=normalMatrix*normal;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`precision mediump float;uniform vec3 uLightDir;varying vec3 vNormal;void main(){float d=floor(max(dot(normalize(vNormal),normalize(uLightDir)),0.)*3.)/3.;vec3 c=mix(vec3(.25,.03,.06),vec3(.88,.12,.24),step(.33,d));c=mix(c,vec3(1.,.48,.58),step(.66,d));gl_FragColor=vec4(c,1.);}`
});
const outlineMat=new THREE.ShaderMaterial({
  vertexShader:`void main(){gl_Position=projectionMatrix*modelViewMatrix*vec4(position+normal*.02,1.);}`,
  fragmentShader:`void main(){gl_FragColor=vec4(.12,.01,.02,1.);}`,
  side:THREE.BackSide
});

const potionGroup=new THREE.Group();
const flaskGeo=new THREE.SphereGeometry(0.17,24,24);
potionGroup.add(new THREE.Mesh(flaskGeo,celMat));

const neckGeo=new THREE.CylinderGeometry(0.065,0.065,0.14,16);
const neckMesh=new THREE.Mesh(neckGeo,celMat);neckMesh.position.y=0.17;potionGroup.add(neckMesh);
const neckOut=new THREE.Mesh(neckGeo,outlineMat);neckOut.position.y=0.17;potionGroup.add(neckOut);
const corkMesh=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.048,0.07,16),new THREE.MeshStandardMaterial({color:0x854d0e,roughness:0.8}));

potionGroup.position.set(1.425,0.88,2.468);scene.add(potionGroup);
reg(potionGroup.children[0],'potion');reg(neckMesh,'potion');reg(corkMesh,'potion');

const bannerUniforms={uTime:{value:0}};
const bannerMat=new THREE.ShaderMaterial({
  uniforms:bannerUniforms,side:THREE.DoubleSide,
  vertexShader:`uniform float uTime;varying vec2 vUv;void main(){vUv=uv;vec3 p=position;float w=uv.x;p.z+=sin(p.x*5.-uTime*4.)*.09*w+cos(p.y*3.5-uTime*3.)*.05*w+sin((p.x+p.y)*8.-uTime*5.5)*.03*w;gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.);}`,
  fragmentShader:`varying vec2 vUv;void main(){vec3 w=vec3(.96,.97,.98),cr=vec3(.85,.12,.18),g=vec3(.95,.78,.2);float ob=step(vUv.x,.04)+step(.96,vUv.x)+step(vUv.y,.04)+step(.96,vUv.y);float ib=(step(vUv.x,.08)+step(.92,vUv.x)+step(vUv.y,.08)+step(.92,vUv.y))*(1.-ob);vec3 c=mix(w,g,min(ob,1.));c=mix(c,cr,min(ib,1.));float cv=step(.44,vUv.x)*step(vUv.x,.56)*step(.2,vUv.y)*step(vUv.y,.8);float ch=step(.26,vUv.x)*step(vUv.x,.74)*step(.47,vUv.y)*step(vUv.y,.59);vec2 dp=abs(vUv-vec2(.5,.53));c=mix(c,cr,max(cv,ch));c=mix(c,g,step(dp.x+dp.y,.095));gl_FragColor=vec4(c,1.);}`
});
const wavingBanner=new THREE.Mesh(new THREE.PlaneGeometry(0.9,1.1,40,40),bannerMat);
wavingBanner.position.set(-2.1,2.05,1.45);wavingBanner.castShadow=true;scene.add(wavingBanner);
reg(wavingBanner,'banner');
if(poleMesh)reg(poleMesh,'banner');

const PRESETS={
  center_monument:{target:new THREE.Vector3(0,1.57,-2.65),position:new THREE.Vector3(0,1.57,-0.15)},
  left_monument:{target:new THREE.Vector3(-2.45,1.6,-1.56),position:new THREE.Vector3(-1.18,1.6,0.45)},
  character:{target:new THREE.Vector3(2.35,1.15,-1.5),position:new THREE.Vector3(1.05,1.3,0.45)},
  right_monument:{target:new THREE.Vector3(2.35,1.15,-1.5),position:new THREE.Vector3(1.05,1.3,0.45)},
  crystal:{target:new THREE.Vector3(-1.425,0.95,2.468),position:new THREE.Vector3(-1.425,1.1,3.8)},
  potion:{target:new THREE.Vector3(1.425,0.85,2.468),position:new THREE.Vector3(1.425,1,3.8)},
  banner:{target:new THREE.Vector3(-2.1,2.05,1.45),position:new THREE.Vector3(-2.1,2.05,3.25)},
  default:{target:initialCamTarget.clone(),position:initialCamPos.clone()}
};

let flying=false,flyStart=0;
const FLY_DUR=850;
const fpS=new THREE.Vector3(),ftS=new THREE.Vector3(),fpE=new THREE.Vector3(),ftE=new THREE.Vector3();

function flyTo(tgt,pos){
  flying=true;flyStart=performance.now();
  fpS.copy(camera.position);ftS.copy(controls.target);
  fpE.copy(pos);ftE.copy(tgt);
  controls.enabled=false;
}

const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();

function updatePtr(e){
  const r=renderer.domElement.getBoundingClientRect();
  const cx=e.clientX??(e.touches?e.touches[0].clientX:0);
  const cy=e.clientY??(e.touches?e.touches[0].clientY:0);
  pointer.x=((cx-r.left)/r.width)*2-1;
  pointer.y=-((cy-r.top)/r.height)*2+1;
}

window.addEventListener('pointermove',e=>{
  updatePtr(e);raycaster.setFromCamera(pointer,camera);
  document.body.style.cursor=raycaster.intersectObjects(interactableObjects,false).length>0?'pointer':'default';
});

let pdX=0,pdY=0;
window.addEventListener('pointerdown',e=>{pdX=e.clientX;pdY=e.clientY;});
window.addEventListener('pointerup',e=>{
  if(Math.hypot(e.clientX-pdX,e.clientY-pdY)>6)return;
  if(e.target.closest('#btn-reset-cam')||flying)return;
  updatePtr(e);raycaster.setFromCamera(pointer,camera);
  const hits=raycaster.intersectObjects(interactableObjects,false);
  if(hits.length>0){const p=PRESETS[hits[0].object.userData.id];if(p)flyTo(p.target,p.position);}
});

document.getElementById('btn-reset-cam').addEventListener('click',()=>flyTo(PRESETS.default.target,PRESETS.default.position));

window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
});

const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();
  bannerUniforms.uTime.value=t;
  if(flying){
    const el=(performance.now()-flyStart)/FLY_DUR;
    if(el>=1){
      camera.position.copy(fpE);controls.target.copy(ftE);camera.lookAt(ftE);
      flying=false;controls.enabled=true;controls.update();
    }else{
      const p=el<0.5?4*el*el*el:1-Math.pow(-2*el+2,3)/2;
      camera.position.lerpVectors(fpS,fpE,p);
      controls.target.lerpVectors(ftS,ftE,p);
      camera.lookAt(controls.target);
    }
  }else controls.update();

  teleportCrystal.rotation.y=t*0.6;
  teleportCrystal.position.y=1.02+Math.sin(t*1.8)*0.025;
  potionGroup.rotation.y=Math.sin(t*0.8)*0.12;
  potionGroup.position.y=0.88+Math.sin(t*1.8+1.2)*0.02;
  renderer.render(scene,camera);
}
animate();
</script>
