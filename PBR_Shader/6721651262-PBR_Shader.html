<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Assignment 3 - Graphics</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }

        #gui {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            user-select: none;
        }

        #gui label {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
        }

        #gui input[type="range"] {
            cursor: pointer;
            width: 140px;
        }
    </style>
</head>

<body>
    <div id="gui">
        <label>Light X: <span id="valX">4.0</span></label>
        <input type="range" id="sliderX" min="-10" max="10" step="0.5" value="4.0">

        <label>Light Y: <span id="valY">5.0</span></label>
        <input type="range" id="sliderY" min="0.5" max="12" step="0.5" value="5.0">

        <label>Light Z: <span id="valZ">4.0</span></label>
        <input type="range" id="sliderZ" min="-10" max="10" step="0.5" value="4.0">

        <div style="border-top: 1px solid rgba(255,255,255,0.2); margin-top: 8px; padding-top: 8px; font-size: 11px; color: #ccc; line-height: 1.5;">

            <div>• เมาส์: คลิกซ้ายหมุน | Scroll ซูม</div>

            <div>• หมุนตัวแม็ก: Z / X</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/EXRLoader.js"></script>

        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(
            50,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(0, 2.2, 4.2);
        camera.lookAt(0, 0.8, 0);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 0.8, 0);
        controls.maxPolarAngle = Math.PI / 2 - 0.02;
        controls.update();

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.25);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xfff5e6, 2.4);
        directionalLight.position.set(4, 5, 4);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        directionalLight.shadow.bias = -0.00005;
        directionalLight.shadow.normalBias = 0.02;
        scene.add(directionalLight);

        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        pmremGenerator.compileEquirectangularShader();

        new THREE.EXRLoader()
            .setDataType(THREE.UnsignedByteType)
            .load(exrSkyboxUrl, (texture) => {
                const skybox = pmremGenerator.fromEquirectangular(texture).texture;
                scene.background = skybox;
                scene.environment = skybox;

                texture.dispose();
                pmremGenerator.dispose();
            }, undefined, (error) => {
                console.error('Unable to load EXR skybox:', error);
            });

        const plane = new THREE.Mesh(planeGeometry, matFloor);

        const sliderZ = document.getElementById('sliderZ');

            directionalLight.position.x = parseFloat(e.target.value);
            document.getElementById('valX').textContent = e.target.value;
        });

        sliderY.addEventListener('input', (e) => {
            directionalLight.position.y = parseFloat(e.target.value);
            document.getElementById('valY').textContent = e.target.value;
        });

            directionalLight.position.z = parseFloat(e.target.value);
            document.getElementById('valZ').textContent = e.target.value;
        });

        window.addEventListener('keydown', (event) => {
            switch (event.key) {
                case 'ArrowLeft':
                case 'a':
                    directionalLight.position.x -= 0.5;
                    break;
                case 'ArrowRight':
                case 'd':
                    directionalLight.position.x += 0.5;
                    break;
                case 'ArrowUp':
                case 'w':
                    directionalLight.position.z -= 0.5;
                    break;
                case 'ArrowDown':
                case 's':
                    directionalLight.position.z += 0.5;
                    break;
                case 'q':
                    directionalLight.position.y -= 0.5;
                    if (directionalLight.position.y < 0.5) directionalLight.position.y = 0.5;
                    break;
                case 'e':
                    directionalLight.position.y += 0.5;
                    break;
                case 'z':
                    if (staplerMesh) staplerMesh.rotation.y -= 0.1;
                    break;
                case 'x':
                    if (staplerMesh) staplerMesh.rotation.y += 0.1;
                    break;
            }

            sliderX.value = directionalLight.position.x;
            sliderY.value = directionalLight.position.y;
            sliderZ.value = directionalLight.position.z;
            document.getElementById('valX').textContent = directionalLight.position.x.toFixed(1);
            document.getElementById('valY').textContent = directionalLight.position.y.toFixed(1);
            document.getElementById('valZ').textContent = directionalLight.position.z.toFixed(1);
        });

        function animate() {
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
