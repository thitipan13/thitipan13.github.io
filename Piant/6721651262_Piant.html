<html>
<head>
<title>Paint</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #c0c0c0; font-family: 'Tahoma', Arial, sans-serif; font-size: 12px; user-select: none; overflow: hidden; }

  #toolbar {
    display: flex; align-items: center; gap: 8px;
    background: #d4d0c8; border-bottom: 1px solid #808080;
    padding: 4px 8px; flex-wrap: wrap;
  }
  #toolbar label { font-weight: bold; font-size: 11px; }

  .tool-btn {
    width: 34px; height: 34px; border: 2px outset #fff;
    background: #d4d0c8; cursor: pointer; font-size: 15px;
    display: flex; align-items: center; justify-content: center;
  }
  .tool-btn.active { border: 2px inset #808080; background: #b0b0a8; }

  .separator { width: 2px; height: 28px; background: #808080; margin: 0 2px; }

  #color-picker { width: 30px; height: 30px; border: 1px solid #808080; cursor: pointer; padding: 0; }
  #thickness { width: 55px; }
  #thickness-val { min-width: 14px; display: inline-block; text-align: center; }

  .action-btn {
    padding: 3px 10px; border: 2px outset #fff;
    background: #d4d0c8; cursor: pointer; font-size: 11px;
  }
  .action-btn:active { border: 2px inset #808080; }

  #main {
    display: flex; height: calc(100vh - 45px);
  }

  #canvas-wrap {
    flex: 1; display: flex; justify-content: center; align-items: center;
    background: #808080; overflow: auto;
  }
  canvas {
    border: 2px inset #404040; background: #fff;
    image-rendering: pixelated; cursor: crosshair;
  }
</style>
</head>
<body>

<div id="toolbar">
  <button class="tool-btn active" id="btn-pencil" title="ดินสอ (Pencil)">✏️</button>
  <button class="tool-btn" id="btn-line" title="วาดเส้น (Line)">📏</button>
  <button class="tool-btn" id="btn-rect" title="วาดสี่เหลี่ยม (Rectangle)">⬜</button>
  <button class="tool-btn" id="btn-ellipse" title="วาดวงรี (Ellipse)">⭕</button>
  <button class="tool-btn" id="btn-eraser" title="ยางลบ (Eraser)">🗑️</button>

  <div class="separator"></div>

  <label>สี:</label>
  <input type="color" id="color-picker" value="#000000">

  <div class="separator"></div>

  <label>หนา:</label>
  <input type="range" id="thickness" min="1" max="10" value="1">
  <span id="thickness-val">1</span>

  <div class="separator"></div>

  <button class="action-btn" id="btn-clear" title="ล้างกระดาน">🗑️ ล้าง</button>
</div>

<div id="main">
  <div id="canvas-wrap">
    <canvas id="canvas" width="400" height="300" style="width:800px; height:600px;"></canvas>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;
const imageData = ctx.createImageData(W, H);
const pixels = imageData.data;

for (let i = 0; i < pixels.length; i += 4) {
  pixels[i] = 255; pixels[i+1] = 255; pixels[i+2] = 255; pixels[i+3] = 255;
}

let backupPixels = new Uint8ClampedArray(pixels);
function saveBackup() { backupPixels.set(pixels); }
function restoreBackup() { pixels.set(backupPixels); }

function putPixel(x, y, r, g, b, a) {
  if (x < 0 || x >= W || y < 0 || y >= H) return;
  const idx = (y * W + x) * 4;
  pixels[idx] = r;
  pixels[idx + 1] = g;
  pixels[idx + 2] = b;
  pixels[idx + 3] = a;
}

function putBrush(x, y, r, g, b, a, size) {
  const radius = size / 2;
  const radiusSq = radius * radius;
  const rCeil = Math.ceil(radius);
  for (let dy = -rCeil; dy <= rCeil; dy++) {
    for (let dx = -rCeil; dx <= rCeil; dx++) {
      if (dx * dx + dy * dy <= radiusSq) {
        putPixel(x + dx, y + dy, r, g, b, a);
      }
    }
  }
}

function drawLine(x1, y1, x2, y2, r, g, b, a, size) {
  const dx = Math.abs(x2 - x1);
  const dy = Math.abs(y2 - y1);
  const sx = x1 < x2 ? 1 : -1;
  const sy = y1 < y2 ? 1 : -1;
  let err = dx - dy;
  while (true) {
    putBrush(x1, y1, r, g, b, a, size);
    if (x1 === x2 && y1 === y2) break;
    const e2 = 2 * err;
    if (e2 > -dy) { err -= dy; x1 += sx; }
    if (e2 < dx) { err += dx; y1 += sy; }
  }
}

function drawRect(x1, y1, x2, y2, r, g, b, a, size) {
  drawLine(x1, y1, x2, y1, r, g, b, a, size);
  drawLine(x2, y1, x2, y2, r, g, b, a, size);
  drawLine(x2, y2, x1, y2, r, g, b, a, size);
  drawLine(x1, y2, x1, y1, r, g, b, a, size);
}

function drawEllipse(cx, cy, rx, ry, r, g, b, a, size) {
  const steps = Math.max(80, Math.round(Math.max(rx, ry) * 4));
  let prevX = Math.round(cx + rx);
  let prevY = Math.round(cy);
  for (let i = 1; i <= steps; i++) {
    const angle = (2 * Math.PI * i) / steps;
    const curX = Math.round(cx + rx * Math.cos(angle));
    const curY = Math.round(cy + ry * Math.sin(angle));
    drawLine(prevX, prevY, curX, curY, r, g, b, a, size);
    prevX = curX; prevY = curY;
  }
}



function toScaledMousePos(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = W / rect.width;
  const scaleY = H / rect.height;
  return {
    x: Math.floor((clientX - rect.left) * scaleX),
    y: Math.floor((clientY - rect.top) * scaleY)
  };
}


let currentTool = 'pencil';
let drawColor = { r: 0, g: 0, b: 0 };
let lineSize = 1;
let isDrawing = false;
let startX = 0, startY = 0;
let lastX = 0, lastY = 0;

ctx.putImageData(imageData, 0, 0);
saveBackup();




const toolButtons = {
  pencil: document.getElementById('btn-pencil'),
  line: document.getElementById('btn-line'),
  rect: document.getElementById('btn-rect'),
  ellipse: document.getElementById('btn-ellipse'),
  eraser: document.getElementById('btn-eraser')
};

function selectTool(tool) {
  currentTool = tool;
  Object.values(toolButtons).forEach(btn => btn.classList.remove('active'));
  toolButtons[tool].classList.add('active');
}

Object.keys(toolButtons).forEach(tool => {
  toolButtons[tool].addEventListener('click', () => selectTool(tool));
});

document.getElementById('color-picker').addEventListener('input', (e) => {
  const hex = e.target.value;
  drawColor.r = parseInt(hex.substr(1,2), 16);
  drawColor.g = parseInt(hex.substr(3,2), 16);
  drawColor.b = parseInt(hex.substr(5,2), 16);
});

const thicknessSlider = document.getElementById('thickness');
thicknessSlider.addEventListener('input', (e) => {
  lineSize = parseInt(e.target.value);
  document.getElementById('thickness-val').textContent = lineSize;
});


document.getElementById('btn-clear').addEventListener('click', () => {
  for (let i = 0; i < pixels.length; i += 4) {
    pixels[i] = 255; pixels[i+1] = 255; pixels[i+2] = 255; pixels[i+3] = 255;
  }
  ctx.putImageData(imageData, 0, 0);
  saveBackup();
});


canvas.addEventListener('mousedown', (e) => {
  isDrawing = true;
  const pos = toScaledMousePos(e.clientX, e.clientY);
  startX = pos.x; startY = pos.y;
  lastX = pos.x; lastY = pos.y;

  if (currentTool === 'line' || currentTool === 'rect' || currentTool === 'ellipse') {
    saveBackup();
  }

  if (currentTool === 'pencil') {
    putBrush(pos.x, pos.y, drawColor.r, drawColor.g, drawColor.b, 255, lineSize);
    ctx.putImageData(imageData, 0, 0);
  } else if (currentTool === 'eraser') {
    putBrush(pos.x, pos.y, 255, 255, 255, 255, lineSize * 3);
    ctx.putImageData(imageData, 0, 0);
  }
});

canvas.addEventListener('mousemove', (e) => {
  const pos = toScaledMousePos(e.clientX, e.clientY);

  if (!isDrawing) return;

  if (currentTool === 'pencil') {
    drawLine(lastX, lastY, pos.x, pos.y, drawColor.r, drawColor.g, drawColor.b, 255, lineSize);
    ctx.putImageData(imageData, 0, 0);
  } else if (currentTool === 'eraser') {
    drawLine(lastX, lastY, pos.x, pos.y, 255, 255, 255, 255, lineSize * 3);
    ctx.putImageData(imageData, 0, 0);
  } else if (currentTool === 'line') {
    restoreBackup();
    drawLine(startX, startY, pos.x, pos.y, drawColor.r, drawColor.g, drawColor.b, 255, lineSize);
    ctx.putImageData(imageData, 0, 0);
  } else if (currentTool === 'rect') {
    restoreBackup();
    drawRect(startX, startY, pos.x, pos.y, drawColor.r, drawColor.g, drawColor.b, 255, lineSize);
    ctx.putImageData(imageData, 0, 0);
  } else if (currentTool === 'ellipse') {
    restoreBackup();
    const cx = Math.round((startX + pos.x) / 2);
    const cy = Math.round((startY + pos.y) / 2);
    const rx = Math.abs(pos.x - startX) / 2;
    const ry = Math.abs(pos.y - startY) / 2;
    drawEllipse(cx, cy, rx, ry, drawColor.r, drawColor.g, drawColor.b, 255, lineSize);
    ctx.putImageData(imageData, 0, 0);
  }

  lastX = pos.x; lastY = pos.y;
});

canvas.addEventListener('mouseup', (e) => {
  if (!isDrawing) return;
  isDrawing = false;
  const pos = toScaledMousePos(e.clientX, e.clientY);

  if (currentTool === 'line') {
    restoreBackup();
    drawLine(startX, startY, pos.x, pos.y, drawColor.r, drawColor.g, drawColor.b, 255, lineSize);
    saveBackup();
    ctx.putImageData(imageData, 0, 0);
  } else if (currentTool === 'rect') {
    restoreBackup();
    drawRect(startX, startY, pos.x, pos.y, drawColor.r, drawColor.g, drawColor.b, 255, lineSize);
    saveBackup();
    ctx.putImageData(imageData, 0, 0);
  } else if (currentTool === 'ellipse') {
    restoreBackup();
    const cx = Math.round((startX + pos.x) / 2);
    const cy = Math.round((startY + pos.y) / 2);
    const rx = Math.abs(pos.x - startX) / 2;
    const ry = Math.abs(pos.y - startY) / 2;
    drawEllipse(cx, cy, rx, ry, drawColor.r, drawColor.g, drawColor.b, 255, lineSize);
    saveBackup();
    ctx.putImageData(imageData, 0, 0);
  }
});

canvas.addEventListener('mouseleave', () => { isDrawing = false; });

</script>
</body>
</html>
